<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seekho Saathi — design mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#111936; --muted:#5b6482; --line:#e6e9f2;
  --brand:#4f46e5; --brand-d:#4338ca; --brand-soft:#eef0ff;
  --teal:#10a37f; --teal-soft:#e6f7f1; --amber:#d97706; --amber-soft:#fff4e0; --gray-soft:#eef0f5; --red:#dc2626;
  --r:14px; --shadow:0 1px 2px rgba(17,25,54,.05),0 4px 14px rgba(17,25,54,.05);
  font-family:Inter,"Noto Sans Devanagari",system-ui,sans-serif; color:var(--ink);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hi{font-family:"Noto Sans Devanagari",Inter,sans-serif}
a{color:inherit;text-decoration:none} button{font:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#ef4444 60%,#4f46e5);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800}
.logo b{color:var(--brand)}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side .foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--bg);font-size:13px;color:var(--muted)}
.main{min-width:0}
.top{height:64px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 28px;border-bottom:1px solid var(--line);background:#fff}
.top .mlogo{display:none}
.bell{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--muted);position:relative}
.bell i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:#c7cbe6;color:#fff;display:grid;place-items:center;font-weight:700}
.page{padding:28px;max-width:1180px;margin:0 auto}
h1{font-size:30px;letter-spacing:-.6px;margin:0 0 4px;font-weight:800}
h2{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:hover{border-color:#c9cee0}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.btn.out{border-color:#b9bdf5;color:var(--brand)}
.btn.grn{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ready{background:var(--teal-soft);color:#0b7a5e}.chip.gen{background:var(--amber-soft);color:var(--amber)}.chip.rev{background:var(--brand-soft);color:var(--brand)}.chip.draft{background:var(--gray-soft);color:#4b5563}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:500}
.thumb{width:56px;height:46px;border-radius:9px;display:grid;place-items:center;font-size:26px;flex:none}
.t1{background:linear-gradient(135deg,#fde7c7,#f9c98b)}.t2{background:linear-gradient(135deg,#dbeafe,#93c5fd)}.t3{background:linear-gradient(135deg,#dcfce7,#86efac)}.t4{background:linear-gradient(135deg,#fef9c3,#fcd34d)}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px}
.hcard{border-radius:18px;padding:28px;min-height:230px;position:relative;overflow:hidden;border:1px solid var(--line)}
.hcard.a{background:linear-gradient(135deg,#eceaff,#f4f2ff)}.hcard.b{background:linear-gradient(135deg,#e4f6ee,#effaf5)}
.hcard h2 a:hover{color:var(--teal)}.hcard h2{font-size:25px;line-height:1.2;margin-bottom:10px;letter-spacing:-.5px}
.hcard p{color:var(--muted);max-width:290px;margin:0 0 18px}
.hcard .art{position:absolute;right:20px;top:20px;font-size:64px;opacity:.9}
.askbox{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;max-width:440px}
.askbox input{flex:1;border:0;outline:0;padding:8px 10px;font:inherit;min-width:0;background:transparent}

table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--muted);font-weight:600;text-align:left;padding:12px 16px;background:#fafbfe;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.ttl{display:flex;gap:14px;align-items:center}.ttl b{display:block;font-weight:600}.ttl small{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow:auto}
.tab{padding:10px 16px;border:0;background:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;color:var(--muted);font-weight:600}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;color:var(--muted)}
.search input{border:0;outline:0;font:inherit;width:190px;background:transparent}

/* whiteboard */
.stage{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.board{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.bwrap{aspect-ratio:16/10;padding:22px 26px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#fff,#fcfcff);position:relative}
.bh{font-size:26px;font-weight:700;color:#1e1b4b;font-family:"Noto Sans Devanagari",sans-serif}
.pics{display:flex;gap:16px;flex:1;min-height:0}
.pic{flex:1;border-radius:14px;display:grid;place-items:center;font-size:84px;position:relative;border:1px solid var(--line)}
.pic span{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:17px;font-weight:700;font-family:"Noto Sans Devanagari",sans-serif;color:#1f2937}
.notes{display:flex;gap:10px;flex-wrap:wrap}
.note{background:var(--amber-soft);color:#92400e;padding:6px 12px;border-radius:10px;font-weight:600;font-family:"Noto Sans Devanagari",sans-serif}
.qban{background:var(--brand);color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-family:"Noto Sans Devanagari",sans-serif}
.cap{margin:0;padding:12px 18px;background:#0f172a;color:#fff;font-family:"Noto Sans Devanagari",sans-serif;font-size:17px;text-align:center}
.ctrl{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
.ctrl .play{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;border:0;display:grid;place-items:center}
.track{flex:1;height:6px;background:var(--gray-soft);border-radius:9px;position:relative}.track i{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--brand);border-radius:9px}
.panel{padding:18px}.panel h3{margin:0 0 12px;font-size:16px}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;color:var(--muted)}.step b{width:24px;height:24px;border-radius:50%;background:var(--gray-soft);display:grid;place-items:center;font-size:12px;flex:none}
.step.done b{background:var(--teal);color:#fff}.step.cur{color:var(--ink);font-weight:600}.step.cur b{background:var(--brand);color:#fff}
.bubble{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:92%}.bubble.u{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.bubble.t{background:var(--gray-soft);border-bottom-left-radius:4px}
.chat{display:flex;flex-direction:column;height:100%}
.chatin{display:flex;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:10px}.chatin input{flex:1;border:0;outline:0;font:inherit;padding:6px 8px;min-width:0}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.iconbtn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.teacher{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.tav{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#fb923c,#ef4444);display:grid;place-items:center;font-size:24px;box-shadow:0 0 0 4px rgba(239,68,68,.15)}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px;margin-left:auto}.eq i{width:4px;background:var(--teal);border-radius:2px;animation:eq 1s infinite ease-in-out}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.code{display:inline-flex;gap:8px;align-items:center;background:var(--brand-soft);color:var(--brand);padding:6px 12px;border-radius:10px;font-weight:700;letter-spacing:2px}
.person{display:flex;align-items:center;gap:10px;padding:7px 0}.person .av{width:30px;height:30px;font-size:13px}
.ptt{width:100%;justify-content:center;padding:14px;font-size:16px}

/* teacher */
.cols{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.para{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;font-family:"Noto Sans Devanagari",sans-serif;font-size:16px;line-height:1.7;cursor:pointer}
.para.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.mini{display:flex;gap:10px;margin-top:10px}.mini div{width:92px;height:64px;border-radius:9px;display:grid;place-items:center;font-size:30px;position:relative}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.diff>div{border-radius:10px;padding:10px;font-family:"Noto Sans Devanagari",sans-serif;font-size:14px}
.diff .o{background:#fef2f2;border:1px solid #fecaca}.diff .n{background:#ecfdf5;border:1px solid #a7f3d0}.diff small{display:block;font-family:Inter;font-weight:700;color:var(--muted);margin-bottom:4px}
.check{display:flex;gap:10px;align-items:center;padding:7px 0}.check .ok{color:var(--teal)}.check .warn{color:var(--amber)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat .card{padding:16px 18px}.stat b{font-size:26px;display:block;letter-spacing:-.5px}.stat span{color:var(--muted);font-size:13px}
.drop{border:2px dashed #c3c8f2;border-radius:16px;padding:34px;text-align:center;background:#fafaff}
.prog{height:8px;border-radius:9px;background:var(--gray-soft);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#818cf8);width:62%}
.stepper_unused{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;overflow:auto}
.sp{flex:1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--muted);font-weight:600;white-space:nowrap;min-width:max-content}
.sp b{width:26px;height:26px;border-radius:50%;background:var(--gray-soft);display:grid;place-items:center;font-size:13px;flex:none}
.sp.done b{background:var(--teal);color:#fff}.sp.cur b{background:var(--brand);color:#fff}.sp.cur{color:var(--ink)}
.sp.sel{background:var(--brand-soft);color:var(--brand)}.sp.todo{opacity:.55}
.dots{display:inline-flex;gap:5px}.dots i{width:22px;height:6px;border-radius:9px;background:var(--gray-soft)}.dots i.d{background:var(--teal)}.dots i.c{background:var(--brand)}
.strip{display:flex;gap:10px;overflow:auto;padding-bottom:6px}.scn{flex:none;width:118px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;cursor:pointer}
.scn div{height:62px;border-radius:8px;background:var(--gray-soft);display:grid;place-items:center;font-size:30px;margin-bottom:6px}.scn small{display:block;font-size:12px;color:var(--muted);line-height:1.3}.scn.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cols>*,.stage>*{min-width:0}.stat4{grid-template-columns:repeat(4,1fr)}
.note-bar,.warn-bar{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;margin-bottom:14px;font-size:14px}
.note-bar{background:var(--brand-soft);color:#3730a3}.warn-bar{background:var(--amber-soft);color:#92400e}
.hide{display:none!important}
.mtab{display:none}

@media(max-width:1000px){
  .stage,.cols{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{justify-content:space-between;padding:0 16px}.top .mlogo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
  .top .mlogo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#ef4444 60%,#4f46e5);display:grid;place-items:center;color:#fff}
  .me span{display:none}
  .page{padding:18px 16px 96px}
  h1{font-size:25px}
  .hero{grid-template-columns:1fr}
  .hcard .art{display:none}
  .mtab{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:5;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mtab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px}
  .mtab a.on{color:var(--brand)}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tr{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:14px;border-bottom:1px solid var(--line)}
  .tbl td{padding:0;border:0}.tbl td.c-ttl{grid-column:1/-1}.tbl td.c-type,.tbl td.c-date{display:none}
  .stat{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat4{grid-template-columns:1fr 1fr}.tbl td.c-type.keep{display:block;grid-column:1/-1}.stat b{font-size:20px}
  .bwrap{padding:14px;aspect-ratio:auto;min-height:300px}.bh{font-size:20px}.pic{font-size:54px}
  .diff{grid-template-columns:1fr}
  .search input{width:100px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="logo" href="#/home"><span class="mark hi">सा</span><span>Seekho <b>Saathi</b></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Lessons and classes are taught in <b>Hindi</b>.<br>This screen is in English.</div>
  </aside>
  <div class="main">
    <header class="top">
      <a class="mlogo" href="#/home"><span class="mark hi">सा</span>Seekho Saathi</a>
      <div class="row">
        <button class="bell" aria-label="Notifications"><svg class="i" data-i="bell"></svg><i></i></button>
        <div class="me"><div class="av">A</div><span>Alekh</span><svg class="i sm" data-i="chev" style="color:var(--muted)"></svg></div>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<nav class="mtab" id="mtab"></nav>

<script>
const IC={
home:"M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z",
file:"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5 M9 13h6 M9 17h6",
video:"M3 6h12v12H3z M15 10l6-3v10l-6-3",
layout:"M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z",
bell:"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10 21a2 2 0 0 0 4 0",
play:"M6 4l14 8-14 8z",pause:"M6 4h4v16H6z M14 4h4v16h-4z",
upload:"M12 16V4 M7 9l5-5 5 5 M4 20h16",
arrow:"M5 12h14 M13 6l6 6-6 6",
mic:"M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z M19 11a7 7 0 0 1-14 0 M12 18v4",
edit:"M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",
check:"M20 6L9 17l-5-5",
hand:"M18 11V6a2 2 0 0 0-4 0 M14 10V4a2 2 0 0 0-4 0v6 M10 10.5V6a2 2 0 0 0-4 0v8 M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.5 0-4-1-5.5-2.5L3 15",
send:"M22 2L11 13 M22 2l-7 20-4-9-9-4z",
search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3",
more:"M12 5h.01 M12 12h.01 M12 19h.01",
chev:"M6 9l6 6 6-6",x:"M18 6L6 18 M6 6l12 12",
cam:"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
spark:"M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z",
msg:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
undo:"M3 7v6h6 M21 17a9 9 0 0 0-15-6.7L3 13",
users:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.9 M16 3.1a4 4 0 0 1 0 7.8",
back:"M19 12H5 M11 18l-6-6 6-6",
alert:"M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"
};
const ico=(n,c="")=>`<svg class="i ${c}" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;

const LESSONS=[
 {id:1,t:"पदार्थ और उनके गुण",en:"Materials and their properties",e:"🏺",c:"t1",s:"ready",draft:true,d:"15 Oct 2026, 4:12 PM",min:"6:14",ver:2},
 {id:2,t:"पारदर्शी, अपारदर्शी और पारभासी",en:"Transparent, opaque, translucent",e:"🪟",c:"t2",s:"review",d:"14 Oct 2026, 2:30 PM",min:"5:20"},
 {id:3,t:"वस्तुओं को छाँटना",en:"Sorting objects into groups",e:"🧺",c:"t3",s:"review",d:"12 Oct 2026, 11:20 AM",min:"4:52"},
 {id:4,t:"घुलनशील और अघुलनशील",en:"Soluble and insoluble",e:"🧂",c:"t4",s:"gen",d:"10 Oct 2026, 5:45 PM",min:"—"}];
const CH={ready:["Published","ready"],gen:["Generating","gen"],draft:["Draft","draft"],review:["In review","rev"]};
const NAV=[["home","Home","home"],["lessons","Lessons","file"],["live","Live Classes","video"],["teacher","Teacher dashboard","layout"]];
function lessonRow(l,full){
 const act = l.s==="ready"?`<a class="btn out sm" href="#/player">${ico("play","sm")}Play</a>`
   : l.s==="gen"?`<button class="btn sm" disabled>${ico("play","sm")}View</button>`
   : `<a class="btn out sm" href="#/teacher/lesson/${l.id}/lecture">${ico("edit","sm")}Edit</a>`;
 return `<tr><td class="c-ttl"><div class="ttl"><div class="thumb ${l.c}">${l.e}</div><div><b class="hi">${l.t}</b><small>${l.en} · Class 6 · Science</small></div></div></td>

function draw(){
  const [route,sub]=(location.hash.replace("#/","")||"home").split("/");
  const key=VIEWS[route]?route:"home";
  const navKey=key==="player"?"lessons":key==="room"?"live":key;
  document.getElementById("page").innerHTML=VIEWS[key]();
  const items=NAV.map(([k,l,i])=>`<a href="#/${k}" class="${k===navKey?"on":""}">${ico(i)}<span>${l}</span></a>`).join("");
  document.getElementById("nav").innerHTML=items;
  document.getElementById("mtab").innerHTML=NAV.map(([k,l,i])=>`<a href="#/${k}" class="${k===navKey?"on":""}">${ico(i)}${l.replace("Teacher dashboard","Teacher").replace("Live Classes","Live")}</a>`).join("");
  document.title=`Seekho Saathi — ${key}`;
  window.scrollTo(0,0);
  if(key==="teacher"){
    document.querySelectorAll("[data-sel]").forEach(p=>p.onclick=()=>{document.querySelectorAll("[data-sel]").forEach(x=>x.classList.remove("sel"));p.classList.add("sel")});
    document.querySelectorAll(".scn").forEach(x=>x.onclick=()=>{document.querySelectorAll(".scn").forEach(y=>y.classList.remove("on"));x.classList.add("on")});
    const ok=document.getElementById("ok"),pb=document.getElementById("pub");
    if(ok)ok.onchange=()=>pb.disabled=!ok.checked;
    if(pb)pb.onclick=()=>{location.hash="#/teacher/published"};
  }
  const seg=document.getElementById("seg");
  if(seg)seg.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{seg.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    const f=[null,"ready","gen","draft"][i];document.getElementById("lrows").innerHTML=LESSONS.filter(l=>!f||l.s===f).map(lessonRow).join("")});
  document.querySelectorAll("svg[data-i]").forEach(s=>{s.setAttribute("viewBox","0 0 24 24");s.innerHTML=`<path d="${IC[s.dataset.i]}"/>`});
}
addEventListener("hashchange",draw);draw();
</script>
</body>
</html>
